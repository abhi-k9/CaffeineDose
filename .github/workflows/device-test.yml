name: Device test

# Runs the debug app on an Android emulator and checks, second by second, that the screen really stays on while a timer
# runs, see .github/scripts/device-test.sh. On demand only (Actions → Device test → Run workflow): it takes several
# minutes, and emulators are less reliable than the unit tests of the CI workflow.
on:
  workflow_dispatch:
    inputs:
      api:
        description: Android API level of the emulator image, e.g. 34, 36, 36.1 or 37.0
        required: true
        default: "36"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  emulator:
    name: Emulator (API ${{ inputs.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      # Debug builds record diagnostics by default: the test collects the app's own log.
      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Hardware acceleration for the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Creates the AVD, boots the emulator (with a boot timeout), runs the script, then shuts the emulator down.
      - name: Run the scenarios
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The defaults are too small for recent images: the app can't be installed, the system restarts.
          disk-size: 6000M
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: .github/scripts/device-test.sh app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/device-test"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-test-api-${{ inputs.api }}
          path: ${{ runner.temp }}/device-test
          if-no-files-found: ignore
