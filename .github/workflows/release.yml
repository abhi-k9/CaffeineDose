name: Release

# Builds a signed release APK and publishes it as a GitHub Release, either:
# - when a `vX.Y.Z` tag pointing to a commit of `main` is pushed,
# - or when run manually (Actions → Release → Run workflow) on `main`: the tag is then created from the app version.
# Requires the repository secrets described in the README ("Releasing").
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scopes the signing secrets: protection rules (required reviewers, allowed refs) can be added to this environment
    # in Settings → Environments.
    environment: release
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the build provenance attestation with Sigstore
      attestations: write # store the build provenance attestation
    env:
      # SHA-256 digest of the release signing certificate, from the repository variable described in the README: an APK
      # signed with any other key is never published.
      SIGNING_CERT_SHA256: ${{ vars.CAFFEINEDOSE_SIGNING_CERT_SHA256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Released artifacts are always built from scratch: no cache shared with other workflows can alter them.
          cache-disabled: true

      # Everything that can be checked before building, so that a misconfigured release fails in seconds.
      - name: Resolve the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Accepts the digest as printed by apksigner (lowercase hex) or keytool (uppercase, colon separated).
          cert=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if ! [[ "$cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Missing or invalid CAFFEINEDOSE_SIGNING_CERT_SHA256 repository variable, see README (Releasing)"
            exit 1
          fi
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

          changelog="fastlane/metadata/android/en-US/changelogs/$(./gradlew --quiet :app:printVersionCode | tail -n 1).txt"
          if [ ! -s "$changelog" ]; then
            echo "::error::Missing $changelog: it is the release notes of this version"
            exit 1
          fi
          echo "CHANGELOG=$changelog" >> "$GITHUB_ENV"

          tag="v$(./gradlew --quiet :app:printVersionName | tail -n 1)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version $tag (app/build.gradle.kts)"
              exit 1
            fi
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
            if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
              echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main ($status)"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases must be run on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::Release $tag already exists: bump the version in app/build.gradle.kts first"
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CAFFEINEDOSE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing CAFFEINEDOSE_SIGNING_KEYSTORE_BASE64 secret, see README (Releasing)"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CAFFEINEDOSE_SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, test & lint
        env:
          CAFFEINEDOSE_SIGNING_STORE_PASSWORD: ${{ secrets.CAFFEINEDOSE_SIGNING_STORE_PASSWORD }}
          CAFFEINEDOSE_SIGNING_KEY_ALIAS: ${{ secrets.CAFFEINEDOSE_SIGNING_KEY_ALIAS }}
          CAFFEINEDOSE_SIGNING_KEY_PASSWORD: ${{ secrets.CAFFEINEDOSE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease :core:test lint --stacktrace

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was produced, check the signing secrets"
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/apksigner
          digests=$("$apksigner" verify --verbose --print-certs "$apk" | tee /dev/stderr | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
          if [ "$digests" != "$CERT_SHA256" ]; then
            echo "::error::The APK is not signed with the expected certificate ($CERT_SHA256)"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/CaffeineDose-$TAG.apk"
          (cd dist && sha256sum "CaffeineDose-$TAG.apk" > "CaffeineDose-$TAG.apk.sha256")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/CaffeineDose-${{ env.TAG }}.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The changelog of the version, how to verify the download, then the generated list of changes.
          notes="$RUNNER_TEMP/release-notes.md"
          {
            cat "$CHANGELOG"
            printf '\n### Verifying the download\n\n'
            printf -- '- Signing certificate SHA-256: `%s`\n' "$CERT_SHA256"
            printf -- '- Build provenance: `gh attestation verify CaffeineDose-%s.apk --repo %s`\n' "$TAG" "$GITHUB_REPOSITORY"
            printf -- '- Checksum: `sha256sum --check CaffeineDose-%s.apk.sha256`\n' "$TAG"
          } > "$notes"
          # A pushed tag must already exist; a manual run creates it on the built commit.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then target=(--verify-tag); else target=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CaffeineDose $TAG" \
            --notes-file "$notes" \
            --generate-notes \
            "${target[@]}"
